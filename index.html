<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新闻梗图生成器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#15161a;color:#e8e6e3;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh}
.app{display:flex;gap:24px;padding:24px;align-items:flex-start;max-width:1800px;margin:0 auto}
.panel{width:340px;flex:0 0 340px;background:#1e1f25;border:1px solid #2e3038;border-radius:14px;padding:20px}
.panel h1{font-size:19px;margin-bottom:4px}
.panel .hint{font-size:12px;color:#8b8d96;margin-bottom:18px}
.panel label{display:block;font-size:13px;color:#b9bbc4;margin:14px 0 6px}
.panel textarea{width:100%;background:#131418;border:1px solid #33353e;border-radius:8px;color:#fff;padding:10px;font:inherit;font-size:14px;resize:vertical;line-height:1.5}
.panel textarea:focus{outline:none;border-color:#4a7bd4}
.panel input[type=file]{width:100%;font-size:13px;color:#b9bbc4}
.panel button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#e0201a;color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.panel button:hover{background:#f0302a}
.panel .tip{font-size:12px;color:#767983;margin-top:12px;line-height:1.6}
.stage{flex:1;min-width:0;display:flex;justify-content:center}
.canvas-box{position:relative;width:1156px;height:867px;transform-origin:top left;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5);flex:0 0 auto}
.canvas-box img.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tbox{position:absolute;display:flex;align-items:center;justify-content:flex-start;overflow:hidden;background:#fff;color:#000;text-align:left;line-height:1.16;padding:8px 20px;font-family:"SimSun","宋体",serif}
#tTitle{left:6px;top:34px;width:1150px;height:144px;font-weight:700;letter-spacing:0}
#tSub{left:30px;top:166px;width:1126px;height:126px;font-weight:400}
.imgslot{position:absolute;left:494px;top:316px;width:661px;height:518px;overflow:hidden;background:transparent}
.imgslot img{width:100%;height:100%;object-fit:cover;display:none}
@media (max-width:1100px){.app{flex-direction:column}.panel{width:100%;flex:none}.stage{width:100%;overflow:auto}}

.result{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(8,8,10,.9);padding:20px}
.result.on{display:flex}
.result-card{background:#1c1d23;border:1px solid #33353e;border-radius:16px;padding:18px;max-width:92vw;max-height:92vh;overflow:auto;text-align:center}
.result-card p{font-size:13px;color:#a9abb4;margin-bottom:12px}
.result-card img{max-width:100%;max-height:70vh;border-radius:8px;display:block;margin:0 auto}
.result-card .row{display:flex;gap:10px;justify-content:center;margin-top:14px}
.result-card button{padding:10px 18px;border:0;border-radius:8px;background:#33353e;color:#e8e6e3;font:inherit;font-size:14px;cursor:pointer}
.result-card button.primary{background:#e0201a;color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>新闻梗图生成器</h1>
    <p class="hint">黑条 = 主标题（加粗）· 蓝条 = 副标题 · 红块 = 图片</p>

    <label>主标题</label>
    <textarea id="title" rows="2" placeholder="例如：黄仁勋宣布 RTX 6090 只卖 999 元"></textarea>

    <label>副标题 / 正文</label>
    <textarea id="sub" rows="2" placeholder="例如：全场起立鼓掌，英伟达股价应声下跌"></textarea>

    <label>图片（替换右侧红色区域）</label>
    <input type="file" id="file" accept="image/*">

    <button id="export">导出 PNG</button>
    <p class="tip">字号会跟着字数自动缩放；图片按填充裁剪。<br>内容只在本地处理，不上传任何服务器。</p>
  </aside>

      <div class="tbox" id="tTitle"><span id="tTitleSpan"></span></div>
      <div class="tbox" id="tSub"><span id="tSubSpan"></span></div>
      <div class="imgslot" id="slot"><img id="userImg" alt=""></div>
    </div>
  </main>
</div>


<div class="result" id="result">
  <div class="result-card">
    <p>手机长按图片保存 · 电脑右键另存为（如果没弹出下载）</p>
    <img id="resultImg" alt="">
    <div class="row">
      <button class="primary" id="closeResult">关闭</button>
    </div>
  </div>
</div>

<script>
const box = document.getElementById('stageBox');
const tTitle = document.getElementById('tTitle');
const tSub = document.getElementById('tSub');
const tTitleSpan = document.getElementById('tTitleSpan');
const tSubSpan = document.getElementById('tSubSpan');
const userImg = document.getElementById('userImg');
const bg = document.getElementById('bg');

function fit(el, span, text, max, min){
  span.textContent = text || '';
  let size = max;
  el.style.fontSize = size + 'px';
  if(!text) return size;
  let guard = 0;
  while(size > min && guard++ < 200){
    if(span.offsetHeight <= el.clientHeight - 6 && span.offsetWidth <= el.clientWidth - 12) break;
    size -= 2;
    el.style.fontSize = size + 'px';
  }
  return size;
}

function render(){
  const t = document.getElementById('title').value;
  const s = document.getElementById('sub').value;
  fit(tTitle, tTitleSpan, t, 96, 22);
  fit(tSub, tSubSpan, s, 40, 14);
}

['title','sub'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
});

document.getElementById('file').addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  userImg.onload = ()=>{ userImg.style.display='block'; };
  userImg.src = url;
});

function scaleStage(){
  const wrap = document.querySelector('.stage');
  const avail = wrap.clientWidth - 8;
  const sc = Math.min(1, avail / 1156);
  box.style.transform = 'scale(' + sc + ')';
  wrap.style.height = (867 * sc) + 'px';
}
window.addEventListener('resize', scaleStage);

document.getElementById('export').addEventListener('click', ()=>{
  const W = 1156, H = 867;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const draw = ()=>{
    ctx.drawImage(bg, 0, 0, W, H);

    // 用白色盖住原图的黑条与蓝条
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(6, 34, 1150, 144);
    ctx.fillRect(30, 166, 1126, 126);

    const title = document.getElementById('title').value.trim();
    const sub = document.getElementById('sub').value.trim();

    if(userImg.style.display === 'block' && userImg.complete && userImg.naturalWidth){
      const bx=494, by=316, bw=661, bh=518;
      const ar = userImg.naturalWidth / userImg.naturalHeight;
      const ar2 = bw / bh;
      let sx, sy, sw, sh;
      if(ar > ar2){ sh = userImg.naturalHeight; sw = sh * ar2; sx = (userImg.naturalWidth - sw)/2; sy = 0; }
      else { sw = userImg.naturalWidth; sh = sw / ar2; sx = 0; sy = (userImg.naturalHeight - sh)/2; }
      ctx.drawImage(userImg, sx, sy, sw, sh, bx, by, bw, bh);
    }

    function wrap(ctx, text, maxW){
      const lines = [];
      let cur = '';
      for(const ch of text){
        if(ch === '\n'){ lines.push(cur); cur=''; continue; }
        const test = cur + ch;
        if(ctx.measureText(test).width > maxW && cur){
          lines.push(cur); cur = ch;
        } else cur = test;
      }
      if(cur) lines.push(cur);
      return lines;
    }

    function drawBlock(text, x, y, w, h, maxSize, minSize, weight){
      if(!text) return;
      let size = maxSize, lines = [];
      while(size > minSize){
        ctx.font = weight + ' ' + size + 'px "SimSun","宋体",serif';
        lines = wrap(ctx, text, w - 40);
        if(lines.length * size * 1.16 <= h - 12) break;
        size -= 2;
      }
      const lh = size * 1.16;
      const startY = y + (h - lines.length * lh) / 2 + lh * 0.82;
      ctx.fillStyle = '#000000';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      lines.forEach((ln, i)=>ctx.fillText(ln, x + 20, startY + i*lh));
    }

    drawBlock(title, 6, 34, 1150, 144, 96, 22, 'bold');
    drawBlock(sub, 30, 166, 1126, 126, 40, 14, 'normal');

    let dataUrl;
    try {
      dataUrl = c.toDataURL('image/png');
    } catch(err) {
      alert('导出失败：' + err.message);
      return;
    }
    try {
      const a = document.createElement('a');
      a.download = 'news-' + Date.now() + '.png';
      a.href = dataUrl;
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ document.body.removeChild(a); }, 100);
    } catch(err) {}
    const rImg = document.getElementById('resultImg');
    if (rImg) {
      rImg.src = dataUrl;
      document.getElementById('result').classList.add('on');
    }
  };

  if(bg.complete) draw(); else bg.onload = draw;
});

document.getElementById('closeResult').addEventListener('click', ()=>{
  document.getElementById('result').classList.remove('on');
});

window.addEventListener('load', ()=>{ scaleStage(); render(); });
</script>
</body>
</html>
